name: Linting and Specs
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read  # only need to checkout the repo

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: Lint and test
    runs-on: 'ubuntu-22.04'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          bundler-cache: true
      - name: Install dependencies and run

        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          # The runner image pins an old Homebrew and disables auto-update, which
          # cannot parse current homebrew-core formulae ("unknown install step").
          brew update
          brew install actionlint
          make test
