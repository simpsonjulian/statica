name: Acceptance Tests
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read  # only need to checkout the repo and clone WebGoat over HTTPS

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ 'ubuntu-22.04', 'macos-latest' ]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Ensure Ruby and Bundle exist on Linux
      if: ${{ matrix.os == 'ubuntu-22.04' }}
      uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
      with:
        bundler-cache: true

    - name: Install dependencies and run test
      run: make acceptance
      env:
        GH_TOKEN: ${{ github.token }}

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: report-${{ matrix.os }}
        path: WebGoat/statica.html
